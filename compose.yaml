name: leadflow

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leadflow}
      POSTGRES_USER: ${POSTGRES_USER:-leadflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example and set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-leadflow}
      DB_USER: ${POSTGRES_USER:-leadflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      APP_ORIGIN: http://localhost:8080
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      TRUSTED_PROXY_IPS: 172.30.0.10
      AI_ENABLED: ${AI_ENABLED:-false}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_MODEL_URI: ${YANDEX_MODEL_URI:-}
      YANDEX_DATA_LOGGING_ENABLED: "false"
      NOTIFICATIONS_ENABLED: ${NOTIFICATIONS_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      NOTIFICATIONS_SERVICE_TOKEN: ${NOTIFICATIONS_SERVICE_TOKEN:-}
      NOTIFICATION_REMINDER_MINUTES: ${NOTIFICATION_REMINDER_MINUTES:-30}
      MANAGER_PUBLIC_URL: ${MANAGER_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  worker:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-leadflow}
      DB_USER: ${POSTGRES_USER:-leadflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_ENABLED: ${AI_ENABLED:-false}
      YANDEX_API_KEY: ${YANDEX_API_KEY:-}
      YANDEX_MODEL_URI: ${YANDEX_MODEL_URI:-}
      YANDEX_DATA_LOGGING_ENABLED: "false"
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 10s

  web:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      default:
        ipv4_address: 172.30.0.10
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  n8n-db:
    image: postgres:17-alpine
    profiles: ["notifications"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_POSTGRES_DB:-leadflow_n8n}
      POSTGRES_USER: ${N8N_POSTGRES_USER:-leadflow_n8n}
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD:-change-me-before-enabling-notifications}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.44.6
    profiles: ["notifications"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DB:-leadflow_n8n}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:-leadflow_n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:-change-me-before-enabling-notifications}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-change-me-before-enabling-notifications}
      N8N_HOST: localhost
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678
      N8N_SECURE_COOKIE: "false"
      GENERIC_TIMEZONE: Europe/Moscow
      TZ: Europe/Moscow
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./automation/n8n:/imports/workflows:ro
    depends_on:
      n8n-db:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

volumes:
  postgres_data:
  n8n_postgres_data:
  n8n_data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
